<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiCrop - Crop Recommendation</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="text-center text-success">🌱 OptiCrop</h1>
        <p class="text-center">AI-Based Crop Recommendation System</p>

        <form action="/predict" method="POST">

            <div class="mb-3">
                <label>Nitrogen (N)</label>
                <input type="number" class="form-control" name="N" required>
            </div>

            <div class="mb-3">
                <label>Phosphorus (P)</label>
                <input type="number" class="form-control" name="P" required>
            </div>

            <div class="mb-3">
                <label>Potassium (K)</label>
                <input type="number" class="form-control" name="K" required>
            </div>

            <div class="mb-3">
                <label>Temperature (°C)</label>
                <input type="number" step="0.01" class="form-control" name="temperature" required>
            </div>

            <div class="mb-3">
                <label>Humidity (%)</label>
                <input type="number" step="0.01" class="form-control" name="humidity" required>
            </div>

            <div class="mb-3">
                <label>pH</label>
                <input type="number" step="0.01" class="form-control" name="ph" required>
            </div>

            <div class="mb-3">
                <label>Rainfall (mm)</label>
                <input type="number" step="0.01" class="form-control" name="rainfall" required>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Predict Crop
            </button>

        </form>

    </div>

</div>

</body>
</html>
